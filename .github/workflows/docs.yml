name: docs

# Every PR builds and strict-validates the MkDocs site. Pushes to main also deploy.
# Deploy used to be manual-only, so that a push could not fail on a repository
# where Pages was off. Pages is on now, and the guard had outlived it: the site
# went stale silently, and README links to pages that only existed in the
# source tree returned 404 -- which is worse than the red run it was avoiding.
# `workflow_dispatch` is kept for re-publishing without a commit.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs cancel only earlier runs for the same PR. Main/manual Pages runs
  # keep their existing group and cannot be canceled by a PR validation.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: node --test tests/javascript/experience.test.cjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # cairosvg loads libcairo at runtime; the social plugin needs it to
      # render the per-page cards, and the build fails without it.
      - run: sudo apt-get update && sudo apt-get install -y libcairo2
      - run: pip install "mkdocs-material[imaging]>=9.5" playwright
      - run: python -m playwright install --with-deps chromium
      - run: mkdocs build --clean --strict
      - run: python tests/test_site_navigation.py site
      - run: python tools/check_site_layout.py site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: site-layout-screenshots
          path: layout-screenshots
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    # A push to main, or a manual re-publish. Anything else -- a PR build --
    # validates and stops, because a fork's build must never reach Pages.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
