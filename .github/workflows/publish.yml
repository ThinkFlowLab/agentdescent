name: publish

# Publish to PyPI via Trusted Publishing (OIDC) — no API token stored.
# Setup (once): on PyPI add a "pending publisher" for this repo with
#   owner/repo = ThinkFlowLab/agentdescent, workflow = publish.yml, environment = pypi
#   (https://pypi.org/manage/account/publishing/).
# Then publishing = creating a GitHub Release (or running this workflow manually).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - run: pip install twine && twine check dist/*
      # Keep the same built-wheel install and runtime gate in front of PyPI.
      - run: bash scripts/smoke-wheel.sh dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
